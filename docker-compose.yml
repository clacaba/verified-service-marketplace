services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [storage-data:/data]
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ApplyMigrations: "true"
      Email__Enabled: "true"
      Email__Host: mailpit
      Email__Port: "1025"
      Web__PublicOrigin: http://localhost:3000
      DataProtection__KeyPath: /app/keys
      ConnectionStrings__Marketplace: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5080:8080"]
    volumes: [api-keys:/app/keys]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:8080
      WEB_ORIGIN: http://localhost:3000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  postgres-data:
  storage-data:
  api-keys:
